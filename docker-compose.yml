# RAGNAR Ω OMNI v33.0 — full-stack deployment
# docker compose up --build -d
services:
  api:
    build: .
    image: ragnar-omni:33.0
    container_name: ragnar-api
    restart: unless-stopped
    env_file: .env            # RAGNAR_OMEGA_KEY (required for execution), RAGNAR_API_KEY (optional)
    ports:
      - "127.0.0.1:8000:8000" # never expose bare to the internet; front with TLS
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
