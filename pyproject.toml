[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnar-omni"
version = "33.1.0"
description = "RAGNAR Ω OMNI v33.0 — asymmetric, zero-trust, game-theoretic legal defense engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HyyperNab", email = "nab.kta@gmail.com" }]
requires-python = ">=3.11"
keywords = ["legal-defense", "game-theory", "consumer-rights", "spof-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26,<3",
    "fastapi>=0.111",  # ragnar.api ships with the package; the server is platform-provided
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
api = ["uvicorn>=0.30"]  # local serving only; Vercel/Docker provide the server

[project.scripts]
ragnar = "ragnar.gen5_integration:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragnar = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF", "S", "DTZ", "G", "RET"]
# DTZ011: date.today() is CORRECT for Verjährung/legal civil-date arithmetic (the
#         v33.0 lint pass: "date for legal dates; tz-aware datetime for audit events").
# RUF001/002/003: German legal prose (§, –, „") is the product, not an ambiguity.
ignore = ["DTZ011", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "E501", "S108"]
"src/ragnar/gen4_execution.py" = ["E501"]  # German legal prose is the product; code is not
"src/ragnar/gen5_integration.py" = ["E501"]  # the test table rows exceed 100 cols by design
"src/ragnar/__init__.py" = ["F822"]  # PEP 562 lazy re-exports are invisible to static analysis

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Staged gate (deploy protocol): strict on the reasoning core, pragmatic on prose carriers.
[[tool.mypy.overrides]]
module = "ragnar.gen4_execution"
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = "ragnar.gen5_integration"
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
